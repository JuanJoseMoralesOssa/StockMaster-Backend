apiVersion: 2023-05-01
location: South Central US
name: backend-inventory-app
properties:
  managedEnvironmentId: /subscriptions/{subscription-id}/resourceGroups/{resource-group}/providers/Microsoft.App/managedEnvironments/{environment-name}
  configuration:
    secrets:
      - name: bd-host
        value: your-postgres-host
      - name: bd-port
        value: "5432"
      - name: bd-user
        value: your-postgres-user
      - name: bd-password
        value: your-postgres-password
      - name: bd-database
        value: your-postgres-database
    activeRevisionsMode: Single
    ingress:
      external: true
      targetPort: 3000
      allowInsecure: false
      traffic:
        - weight: 100
          latestRevision: true
  template:
    containers:
      - image: {your-registry}.azurecr.io/backend-inventory:latest
        name: backend-inventory
        env:
          - name: NODE_ENV
            value: production
          - name: HOST
            value: 0.0.0.0
          - name: PORT
            value: "3000"
          - name: BD_HOST
            secretRef: bd-host
          - name: BD_PORT
            secretRef: bd-port
          - name: BD_USER
            secretRef: bd-user
          - name: BD_PASSWORD
            secretRef: bd-password
          - name: BD_DATABASE
            secretRef: bd-database
        resources:
          cpu: 1
          memory: 2Gi
        probes:
          - type: liveness
            httpGet:
              path: /ping
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          - type: readiness
            httpGet:
              path: /ping
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
    scale:
      minReplicas: 1
      maxReplicas: 5
      rules:
        - name: http-scaling
          http:
            metadata:
              concurrentRequests: "30"
tags:
  environment: production
  project: inventory-backend
