apiVersion: 2023-05-01
location: South Central US
name: backend-inventory-app
properties:
  managedEnvironmentId: /subscriptions/{subscription-id}/resourceGroups/{resource-group}/providers/Microsoft.App/managedEnvironments/{environment-name}
  configuration:
    secrets:
      - name: mysql-host
        value: mysql-jm-inv-bd.mysql.database.azure.com
      - name: mysql-user
        value: bbjbzdifjkMaestraioAdmin
      - name: mysql-password
        value: Maestrotario1234GMRfRkbWFm6tc8a288@95@6n9iWAK3
      - name: mysql-database
        value: jm_inv_db
    activeRevisionsMode: Single
    ingress:
      external: true
      targetPort: 3000
      allowInsecure: false
      traffic:
        - weight: 100
          latestRevision: true
  template:
    containers:
      - image: {your-registry}.azurecr.io/backend-inventory:latest
        name: backend-inventory
        env:
          - name: NODE_ENV
            value: production
          - name: HOST
            value: 0.0.0.0
          - name: PORT
            value: "3000"
          - name: MYSQL_HOST
            secretRef: mysql-host
          - name: MYSQL_USER
            secretRef: mysql-user
          - name: MYSQL_PASSWORD
            secretRef: mysql-password
          - name: MYSQL_DATABASE
            secretRef: mysql-database
        resources:
          cpu: 1
          memory: 2Gi
        probes:
          - type: liveness
            httpGet:
              path: /ping
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          - type: readiness
            httpGet:
              path: /ping
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
    scale:
      minReplicas: 1
      maxReplicas: 5
      rules:
        - name: http-scaling
          http:
            metadata:
              concurrentRequests: "30"
tags:
  environment: production
  project: inventory-backend
