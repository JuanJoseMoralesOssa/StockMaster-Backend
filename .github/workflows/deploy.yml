name: Deploy to Azure Container Apps

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  RESOURCE_GROUP: rg-inventory-backend
  LOCATION: southcentralus
  ENVIRONMENT_NAME: env-inventory-backend
  APP_NAME: backend-inventory-app
  REGISTRY_NAME: acrinventorybackend
  IMAGE_NAME: backend-inventory

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📚 Install dependencies
        run: npm ci

      - name: 🔨 Build project
        run: npm run build

      - name: 🧪 Run tests
        run: npm run test:coverage
        continue-on-error: true

      - name: 🔍 Run linting
        run: npm run lint
        continue-on-error: true

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔑 Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 🏗️ Create or Update Resource Group
        run: |
          az group create \
            --name ${{ env.RESOURCE_GROUP }} \
            --location ${{ env.LOCATION }}

      - name: 📦 Create or Update Azure Container Registry
        run: |
          # Crear ACR si no existe
          if ! az acr show --name ${{ env.REGISTRY_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} &> /dev/null; then
            echo "Creating new ACR..."
            az acr create \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --name ${{ env.REGISTRY_NAME }} \
              --sku Basic \
              --admin-enabled true
          else
            echo "ACR already exists, ensuring admin is enabled..."
            az acr update \
              --name ${{ env.REGISTRY_NAME }} \
              --admin-enabled true
          fi

      - name: 🔑 Get ACR credentials
        id: acr-creds
        run: |
          ACR_SERVER=$(az acr show --name ${{ env.REGISTRY_NAME }} --query loginServer --output tsv)
          ACR_USERNAME=$(az acr credential show --name ${{ env.REGISTRY_NAME }} --query username --output tsv)
          ACR_PASSWORD=$(az acr credential show --name ${{ env.REGISTRY_NAME }} --query passwords[0].value --output tsv)

          echo "acr-server=$ACR_SERVER" >> $GITHUB_OUTPUT
          echo "acr-username=$ACR_USERNAME" >> $GITHUB_OUTPUT
          echo "::add-mask::$ACR_PASSWORD"
          echo "acr-password=$ACR_PASSWORD" >> $GITHUB_OUTPUT

      - name: 🔐 Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.acr-creds.outputs.acr-server }}
          username: ${{ steps.acr-creds.outputs.acr-username }}
          password: ${{ steps.acr-creds.outputs.acr-password }}

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          buildkitd-flags: --debug



      - name: 🐳 Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.acr-creds.outputs.acr-server }}/${{ env.IMAGE_NAME }}:latest
            ${{ steps.acr-creds.outputs.acr-server }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🌍 Create or Update Container Apps Environment
        run: |
          if ! az containerapp env show --name ${{ env.ENVIRONMENT_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} &> /dev/null; then
            echo "Creating new Container Apps Environment..."
            az containerapp env create \
              --name ${{ env.ENVIRONMENT_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --location ${{ env.LOCATION }}
          else
            echo "Container Apps Environment already exists"
          fi

      - name: 🚀 Deploy to Azure Container Apps
        run: |
          # Verificar si la app ya existe
          if az containerapp show --name ${{ env.APP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} &> /dev/null; then
            echo "Updating existing Container App..."
            az containerapp update \
              --name ${{ env.APP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --image ${{ steps.acr-creds.outputs.acr-server }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          else
            echo "Creating new Container App..."
            az containerapp create \
              --name ${{ env.APP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --environment ${{ env.ENVIRONMENT_NAME }} \
              --image ${{ steps.acr-creds.outputs.acr-server }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
              --target-port 3000 \
              --ingress external \
              --registry-server ${{ steps.acr-creds.outputs.acr-server }} \
              --registry-username ${{ steps.acr-creds.outputs.acr-username }} \
              --registry-password ${{ steps.acr-creds.outputs.acr-password }} \
              --cpu 1 \
              --memory 2Gi \
              --min-replicas 1 \
              --max-replicas 5 \
              --secrets \
                mysql-password=${{ secrets.MYSQL_PASSWORD }} \
              --env-vars \
                NODE_ENV=production \
                HOST=0.0.0.0 \
                PORT=3000 \
                MYSQL_HOST=${{ secrets.MYSQL_HOST }} \
                MYSQL_USER=${{ secrets.MYSQL_USER }} \
                MYSQL_PASSWORD=secretref:mysql-password \
                MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}
          fi

      - name: 🎉 Get Application URL
        id: get-url
        run: |
          APP_URL=$(az containerapp show --name ${{ env.APP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} --query properties.configuration.ingress.fqdn --output tsv)
          echo "app-url=https://$APP_URL" >> $GITHUB_OUTPUT
          echo "### 🚀 Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "- **Application URL**: https://$APP_URL" >> $GITHUB_STEP_SUMMARY
          echo "- **Health Check**: https://$APP_URL/ping" >> $GITHUB_STEP_SUMMARY
          echo "- **API Explorer**: https://$APP_URL/explorer" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

      - name: 🏥 Health Check
        run: |
          echo "Waiting for application to be ready..."
          sleep 30

          APP_URL=${{ steps.get-url.outputs.app-url }}
          MAX_ATTEMPTS=10
          ATTEMPT=1

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Health check attempt $ATTEMPT/$MAX_ATTEMPTS..."

            if curl -f -s "$APP_URL/ping" > /dev/null; then
              echo "✅ Application is healthy!"
              echo "🌐 Application URL: $APP_URL"
              echo "🏥 Health check passed: $APP_URL/ping"
              echo "📚 API Explorer: $APP_URL/explorer"
              break
            else
              echo "⏳ Application not ready yet, waiting..."
              sleep 30
              ATTEMPT=$((ATTEMPT + 1))
            fi

            if [ $ATTEMPT -gt $MAX_ATTEMPTS ]; then
              echo "❌ Health check failed after $MAX_ATTEMPTS attempts"
              echo "Please check the application logs in Azure Portal"
              exit 1
            fi
          done
