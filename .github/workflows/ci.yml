name: CI - Test and Build

on:
  push:
    branches: [develop, feature/*, fix/*]
  pull_request:
    branches: [main, master, develop]

env:
  NODE_VERSION: '22'

jobs:
  test:
    name: 🧪 Test and Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 📚 Install dependencies
        run: npm ci

      - name: 🔍 Run ESLint
        run: npm run lint

      - name: 🔨 Build project
        run: npm run build

      - name: 🧪 Run tests
        run: npm test

      - name: 📊 Generate test coverage
        run: npm run test -- --coverage
        continue-on-error: true

      - name: 📤 Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        if: matrix.node-version == 20
        continue-on-error: true

  docker-test:
    name: 🐳 Docker Build Test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Build Docker image
        run: |
          docker build -t backend-inventory:test .

      - name: 🧪 Test Docker image
        run: |
          # Ejecutar container en background
          docker run -d -p 3000:3000 --name test-container backend-inventory:test

          # Esperar a que la aplicación inicie
          sleep 30

          # Verificar que el container está corriendo
          docker ps | grep test-container

          # Test básico de salud (si tienes endpoint de health)
          # curl -f http://localhost:3000/ping || echo "Health check endpoint not available"

          # Limpiar
          docker stop test-container
          docker rm test-container

  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📚 Install dependencies
        run: npm ci

      - name: 🔍 Run npm audit
        run: npm audit --audit-level high
        continue-on-error: true

      - name: 🔒 Run Snyk security scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true

  code-quality:
    name: 📈 Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necesario para SonarCloud

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📚 Install dependencies
        run: npm ci

      - name: 🔨 Build project
        run: npm run build

      - name: 🧪 Run tests with coverage
        run: npm test -- --coverage
        continue-on-error: true

      - name: 📊 SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true
