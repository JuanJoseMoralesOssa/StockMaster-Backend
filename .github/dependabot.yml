version: 2
updates:
  # Mantener dependencias de npm actualizadas
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 10
    assignees:
      - 'JuanJoseMoralesOssa' # Reemplaza con tu username de GitHub
    commit-message:
      prefix: '📦'
      prefix-development: '📦 dev'
    labels:
      - 'dependencies'
      - 'npm'
    groups:
      loopback:
        patterns:
          - '@loopback/*'
        update-types:
          - 'minor'
          - 'patch'
      types:
        patterns:
          - '@types/*'
      dev-tools:
        patterns:
          - 'eslint*'
          - 'prettier*'
          - 'typescript'
        update-types:
          - 'minor'
          - 'patch'

  # Mantener GitHub Actions actualizadas
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 5
    assignees:
      - 'JuanJoseMoralesOssa' # Reemplaza con tu username de GitHub
    commit-message:
      prefix: '🔄'
    labels:
      - 'github-actions'
      - 'dependencies'

  # Mantener Dockerfile actualizado
  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'monthly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 5
    assignees:
      - 'JuanJoseMoralesOssa' # Reemplaza con tu username de GitHub
    commit-message:
      prefix: '🐳'
    labels:
      - 'docker'
      - 'dependencies'
