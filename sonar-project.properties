sonar.projectKey=inventory-backend
sonar.organization=tu-organizacion-sonarcloud

# Información del proyecto
sonar.projectName=Backend Inventory
sonar.projectVersion=1.0

# Configuración de fuentes
sonar.sources=src
sonar.tests=src/__tests__
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts

# Exclusiones
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.d.ts,**/coverage/**

# Configuración de TypeScript
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Configuración de cobertura
sonar.coverage.exclusions=src/__tests__/**,**/*.test.ts,**/*.spec.ts,src/migrate.ts,src/openapi-spec.ts

# Configuración de duplicación
sonar.cpd.exclusions=src/models/**,src/repositories/**
